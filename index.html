<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Deploy-Test · Entwurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6F4EF; --text:#1B1B1F; --tint:#E6E1D6; }
  * { box-sizing:border-box; margin:0; }
  html { -webkit-text-size-adjust:100%; }
  body { min-height:100svh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,sans-serif; text-align:center; padding:16px; }
  .card { background:var(--tint); padding:48px 32px; border-radius:20px; max-width:560px; width:100%; }
  .brand { font-family:'Unbounded',sans-serif; font-weight:400; letter-spacing:.08em; font-size:14px; opacity:.6; }
  h1 { font-weight:300; font-size:clamp(28px,6vw,44px); margin:20px 0 12px; text-wrap:balance; }
  p { opacity:.7; }
  .ok { display:inline-block; margin-top:24px; padding:10px 20px; border-radius:999px; background:var(--text); color:var(--bg); font-size:15px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">LÖVENBERG</div>
    <h1>Deploy läuft.</h1>
    <p>Test-Seite vom neuen Mac. Push und GitHub Pages funktionieren.</p>
    <span class="ok">Stand: 01.11.2026</span>
  </div>
</body>
</html>
